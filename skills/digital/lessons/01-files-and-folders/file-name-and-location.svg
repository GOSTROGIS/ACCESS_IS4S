<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" role="img" aria-labelledby="title desc" lang="en">
<title id="title">File name and folder location</title>
<desc id="desc">Documents contains the Riverbend job folder. That folder contains the saved file named material-request_riverbend_2026-11-06_v1. The folders are the location; the file name identifies the work. After saving, close the file, find it again, open it and check the contents.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1512;font-size:20px}.heading{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.line{fill:none;stroke:#4a4e54;stroke-width:3}.box{fill:#ffffff;stroke:#4a4e54;stroke-width:2}</style>
<rect width="720" height="504" rx="8" fill="#f7f4f1"/>
<text x="28" y="44" class="heading">A name tells what. A location tells where.</text><text x="28" y="79" class="small">Example location: Documents / Riverbend job</text><path class="line" d="M62 162V222H112 M146 278V338H196"/><rect class="box" x="28" y="108" width="430" height="90" rx="8"/><text x="44" y="139" class="label">Documents</text><text x="44" y="170" class="small">Start in the agreed practice location.</text><rect class="box" x="112" y="222" width="510" height="90" rx="8"/><text x="128" y="253" class="label">Riverbend job</text><text x="128" y="284" class="small">The folder groups this job’s paperwork.</text><rect class="box" x="196" y="338" width="496" height="90" rx="8"/><text x="212" y="369" class="label">The saved file</text><text x="212" y="400" class="small">material-request_riverbend_2026-11-06_v1</text><text x="28" y="474" class="label">Save → close → find → open → check the contents.</text>
</svg>
