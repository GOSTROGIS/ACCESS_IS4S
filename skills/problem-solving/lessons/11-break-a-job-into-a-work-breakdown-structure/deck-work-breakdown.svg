<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Backyard deck work breakdown structure</title>
<desc id="desc">Job 1, Backyard deck, contains six branches: 1.1 Footings, with 1.1.1 Layout and post holes and 1.1.2 Pier footings; 1.2 Frame, with 1.2.1 Posts and beams and 1.2.2 Joists; 1.3 Decking; 1.4 Stairs, with 1.4.1 Stair stringers and 1.4.2 Finished stairs; 1.5 Railings; and 1.6 Close-out, with 1.6.1 Final inspection and 1.6.2 Cleanup and handover. Branches show what is included, not the order of work.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1512;font-size:20px}.heading{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.line{fill:none;stroke:#4a4e54;stroke-width:3}.box{fill:#ffffff;stroke:#4a4e54;stroke-width:2}</style>
<rect width="720" height="810" rx="8" fill="#f7f4f1"/>
<text x="28" y="44" class="heading">Backyard deck: pieces within the whole job</text><text x="28" y="79" class="small">Read the branches as “contains”, not “happens next”.</text><rect class="box" x="28" y="104" width="664" height="52" rx="8"/><text x="48" y="138" class="label">1  Backyard deck</text><path class="line" d="M52 156V674"/><path class="line" d="M52 204H80"/><rect class="box" x="80" y="180" width="612" height="96" rx="8"/><text x="96" y="210" class="label">1.1  Footings</text><text x="120" y="237">1.1.1  Layout and post holes</text><text x="120" y="263">1.1.2  Pier footings</text><path class="line" d="M52 314H80"/><rect class="box" x="80" y="290" width="612" height="96" rx="8"/><text x="96" y="320" class="label">1.2  Frame</text><text x="120" y="347">1.2.1  Posts and beams</text><text x="120" y="373">1.2.2  Joists</text><path class="line" d="M52 424H80"/><rect class="box" x="80" y="400" width="612" height="56" rx="8"/><text x="96" y="430" class="label">1.3  Decking</text><path class="line" d="M52 494H80"/><rect class="box" x="80" y="470" width="612" height="96" rx="8"/><text x="96" y="500" class="label">1.4  Stairs</text><text x="120" y="527">1.4.1  Stair stringers</text><text x="120" y="553">1.4.2  Finished stairs</text><path class="line" d="M52 604H80"/><rect class="box" x="80" y="580" width="612" height="56" rx="8"/><text x="96" y="610" class="label">1.5  Railings</text><path class="line" d="M52 674H80"/><rect class="box" x="80" y="650" width="612" height="96" rx="8"/><text x="96" y="680" class="label">1.6  Close-out</text><text x="120" y="707">1.6.1  Final inspection</text><text x="120" y="733">1.6.2  Cleanup and handover</text><text x="28" y="780" class="label">One home for every piece. No missing or extra scope.</text>
</svg>
