<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 754" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Likelihood by impact risk score matrix</title>
<desc id="desc">Rows are likelihood 3, 2, 1; columns are impact 1, 2, 3. Row 3 has scores 3 medium, 6 high, 9 high. Row 2 has 2 low, 4 medium, 6 high. Row 1 has 1 low, 2 low, 3 medium. High scores require a plan now and daily checks; medium scores require a plan and checks at planning meetings; low scores are recorded and watched. This lesson’s grid is for time, cost and quality, not safety triage.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1a1512;font-size:20px}.heading{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.line{fill:none;stroke:#4a4e54;stroke-width:3}.box{fill:#ffffff;stroke:#4a4e54;stroke-width:2}</style>
<rect width="720" height="754" rx="8" fill="#f7f4f1"/>
<text x="28" y="44" class="heading">Risk score = likelihood × impact</text><text x="28" y="79" class="small">Use this lesson’s scale for time, cost and quality.</text><text x="28" y="126" class="label">Likelihood</text><text x="280" y="126" class="label">Impact →</text><text x="257" y="166" class="small">1 · Small</text><text x="402" y="166" class="small">2 · Medium</text><text x="547" y="166" class="small">3 · Serious</text><text x="28" y="230" class="small">3 · Likely</text><rect x="245" y="190" width="137" height="92" rx="6" fill="#fff0bc" stroke="#4a4e54" stroke-width="2"/><text x="261" y="223" class="label">3 × 1 = 3</text><text x="261" y="255">Medium</text><rect x="390" y="190" width="137" height="92" rx="6" fill="#f7d7d9" stroke="#4a4e54" stroke-width="2"/><text x="406" y="223" class="label">3 × 2 = 6</text><text x="406" y="255">High</text><rect x="535" y="190" width="137" height="92" rx="6" fill="#f7d7d9" stroke="#4a4e54" stroke-width="2"/><text x="551" y="223" class="label">3 × 3 = 9</text><text x="551" y="255">High</text><text x="28" y="334" class="small">2 · Could happen</text><rect x="245" y="294" width="137" height="92" rx="6" fill="#ffffff" stroke="#4a4e54" stroke-width="2"/><text x="261" y="327" class="label">2 × 1 = 2</text><text x="261" y="359">Low</text><rect x="390" y="294" width="137" height="92" rx="6" fill="#fff0bc" stroke="#4a4e54" stroke-width="2"/><text x="406" y="327" class="label">2 × 2 = 4</text><text x="406" y="359">Medium</text><rect x="535" y="294" width="137" height="92" rx="6" fill="#f7d7d9" stroke="#4a4e54" stroke-width="2"/><text x="551" y="327" class="label">2 × 3 = 6</text><text x="551" y="359">High</text><text x="28" y="438" class="small">1 · Unlikely</text><rect x="245" y="398" width="137" height="92" rx="6" fill="#ffffff" stroke="#4a4e54" stroke-width="2"/><text x="261" y="431" class="label">1 × 1 = 1</text><text x="261" y="463">Low</text><rect x="390" y="398" width="137" height="92" rx="6" fill="#ffffff" stroke="#4a4e54" stroke-width="2"/><text x="406" y="431" class="label">1 × 2 = 2</text><text x="406" y="463">Low</text><rect x="535" y="398" width="137" height="92" rx="6" fill="#fff0bc" stroke="#4a4e54" stroke-width="2"/><text x="551" y="431" class="label">1 × 3 = 3</text><text x="551" y="463">Medium</text><text x="28" y="546" class="label">Rain example: likelihood 3 × impact 2 = 6 (high).</text><text x="28" y="585" class="small">High: plan now; check daily. Medium: check at meetings.</text><text x="28" y="615" class="small">Low: record and watch. Colour is not needed to read a score.</text><rect x="20" y="644" width="680" height="90" rx="6" fill="#ffffff" stroke="#4a4e54" stroke-width="2"/><text x="36" y="677" class="label">Safety is not ranked by this grid.</text><text x="36" y="707" class="small">Report an unsafe condition promptly; use safety procedures.</text>
</svg>
