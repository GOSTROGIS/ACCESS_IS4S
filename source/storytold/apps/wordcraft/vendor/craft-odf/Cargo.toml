[package]
name = "craft-odf"
description = "OpenDocument packages: the ZIP container with its mimetype and manifest, password protection (AES-256-CBC, PBKDF2) and flat single-file documents, read and written."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
craft-xml = { git = "https://github.com/storytold/craft-libs", rev = "41fb227542efb8a7748caa1c659f271d8605303c", version = "=0.1.0" }
thiserror = { version = "2" }
# `test-support`: `zip_guard::zip64_entry_count_sample` is public here.
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "41fb227542efb8a7748caa1c659f271d8605303c", version = "=0.1.0", features = ["test-support"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.23"
# Password-protected packages (ODF 1.3 Part 2 section 3.4): AES-256-CBC, SHA-1/SHA-256, PBKDF2
# (HMAC-SHA-1).
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.3"
zeroize = "1"

[features]
# ODT documents: read into and written from the craft-flow model and a craft-wordmodel Document.
text = ["dep:craft-flow", "dep:craft-wordmodel", "dep:craft-math", "dep:craft-metafile", "dep:image", "dep:chrono", "dep:log", "dep:js-sys"]

[dependencies.craft-flow]
git = "https://github.com/storytold/craft-libs"
rev = "41fb227542efb8a7748caa1c659f271d8605303c"
version = "=0.1.0"
optional = true

[dependencies.craft-wordmodel]
git = "https://github.com/storytold/craft-libs"
rev = "41fb227542efb8a7748caa1c659f271d8605303c"
version = "=0.1.0"
optional = true

[dependencies.craft-math]
git = "https://github.com/storytold/craft-libs"
rev = "41fb227542efb8a7748caa1c659f271d8605303c"
version = "=0.1.0"
optional = true

[dependencies.craft-metafile]
git = "https://github.com/storytold/craft-libs"
rev = "41fb227542efb8a7748caa1c659f271d8605303c"
version = "=0.1.0"
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

[dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["std"]
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dev-dependencies]
# The tests build archives, hostile ones included, by hand.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock for tracked-change dates (`text` feature; `SystemTime::now()` panics there).
js-sys = { version = "0.3", optional = true }
# The browser's `crypto.getRandomValues` for the salts and vectors of encrypted saves.
getrandom = { version = "0.3", features = ["wasm_js"] }
