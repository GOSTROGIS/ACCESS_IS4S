name: Publish ACCESS IS4S
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: access-public-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the public site and check its size
        run: |
          mkdir "$RUNNER_TEMP/public-site"
          git archive HEAD -- index.html 404.html .nojekyll brand assistant/public downloads processing-tools programs skills textbook tools source ':!source/storytold/apps' | tar -x -C "$RUNNER_TEMP/public-site"
          test "$(du -sb "$RUNNER_TEMP/public-site" | cut -f1)" -le 1000000000
          python3 source/site/build_processing_workspace.py
          git diff --exit-code -- processing-tools
          node --test source/site/test-student-*.mjs
      - name: Save and reopen an editor download in a browser project
        run: |
          npm install --prefix "$RUNNER_TEMP/processing-browser" playwright@1.56.1
          "$RUNNER_TEMP/processing-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8799 --directory "$RUNNER_TEMP/public-site" --bind 127.0.0.1 > "$RUNNER_TEMP/processing-http.log" 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/processing-browser/node_modules"
          node source/site/test-processing-download.cjs http://127.0.0.1:8799/processing-tools/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-site
  # Deploying in its own job, as GitHub's Pages starter does: a failed deploy can be re-run alone, without the
  # build. deploy-pages looks the upload up once, and on large sites the artifact service has not always listed
  # it yet, so a failed first try waits a minute and tries once more.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
