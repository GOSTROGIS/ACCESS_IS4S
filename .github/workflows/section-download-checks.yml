name: Verify all nine offline sections
on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'skills/**'
      - 'brand/**'
      - 'textbook/assets/**'
      - 'source/site/build_downloads.py'
      - 'source/site/test_downloads.py'
      - 'source/site/test-downloads-browser.cjs'
      - '.github/workflows/section-download-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shipped ZIP freshness, links and embedded templates
        run: python3 source/site/test_downloads.py
      - run: npm install --prefix /tmp/section-tests playwright@1.56.1
      - run: /tmp/section-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Open all nine extracted sections with network disabled
        env:
          NODE_PATH: /tmp/section-tests/node_modules
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node source/site/test-downloads-browser.cjs
