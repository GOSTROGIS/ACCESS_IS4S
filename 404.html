<script>
/* Old addresses from before the nine-skills layout (5 November 2026).
   GitHub Pages serves this page for any missing path, so one list covers every old file. */
(function () {
  var MOVED = [
    ['carpentry/intake-142/', 'programs/carpentry/intake-142/'],
    ['bcbc/', 'programs/carpentry/bcbc-part-9/'],
    ['numeracy-hub/', 'skills/numeracy/hub/'],
    ['shape-canvas/', 'skills/numeracy/shape-canvas/'],
    ['calculators/', 'skills/numeracy/calculators/'],
    ['books/', 'skills/numeracy/books/']
  ];
  var path = location.pathname;
  var m = /^\/access_is4s\//i.exec(path);
  if (!m) return;
  var base = m[0];
  var rest = path.slice(base.length);
  if (/^(numeracy-hub|shape-canvas|calculators|books|bcbc|carpentry\/intake-142)$/.test(rest)) rest += '/';
  for (var i = 0; i < MOVED.length; i++) {
    if (rest.indexOf(MOVED[i][0]) === 0) {
      location.replace(base + MOVED[i][1] + rest.slice(MOVED[i][0].length) + location.search + location.hash);
      return;
    }
  }
})();
</script>
